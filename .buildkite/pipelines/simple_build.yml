steps:
  - label: ":pnpm: install + build"
    agents: {queue: kubernetes}
    image: node:24.21.0-bookworm
    command:
      - cd "/kbn$${BUILDKITE_BUILD_CHECKOUT_PATH#/workspace}"
      - corepack enable
      - corepack prepare pnpm@12.4.2 --activate
      - node scripts/kbn bootstrap --allow-root
      - node scripts/build_kibana_platform_plugins --dist
    env:
      CI_STATS_DISABLED: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      BK_CACHE_COMPRESS_PROGRAM: gzip
    plugins:
      - kubernetes:
          checkout:
            cloneFlags: -v --single-branch --no-tags
            fetchFlags: -v --no-tags
          podSpecPatch:
            containers:
              - name: container-0
                volumeMounts:
                  - name: workspace
                    mountPath: /kbn
      - nienbo/cache#v2.4.21:
          id: node-modules
          backend: tarball
          key: "v2-{{ id }}-{{ checksum 'pnpm-lock.yaml' }}"
          restore-keys:
            - "v2-{{ id }}-"
          compress: 1
          tarball:
            path: /var/cache/buildkite
            max: 7
          paths:
            - node_modules
            - .pnpm-store
            - build/
            - dist/
            - .turbo/
