steps:
  - label: ":pnpm: install + build"
    agents: {queue: kubernetes}
    image: node:24.21.0-bookworm
    command:
      # Os plugins WASM do moon mapeiam a raiz do workspace para o caminho virtual
      # `/workspace`. Como o checkout real tambem comeca com `/workspace/`, o moon
      # confunde caminho real com virtual e nao acha o pnpm-lock.yaml. Rodamos a
      # partir do mesmo volume montado em `/kbn` para evitar a colisao.
      - cd "/kbn$${BUILDKITE_BUILD_CHECKOUT_PATH#/workspace}"
      - corepack enable
      - corepack prepare pnpm@12.4.2 --activate
      - node scripts/kbn bootstrap --allow-root
      - node scripts/build --allow-root
    env:
      # A infra bloqueia saida para ci-stats e cdn.playwright.dev; nenhum dos
      # dois e necessario para o build.
      CI_STATS_DISABLED: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    plugins:
      - kubernetes:
          # Clone raso: o historico do Kibana tem varios GB e o build so precisa
          # do commit atual. O fetch tambem precisa de --depth, senao o agent
          # aprofunda o clone ao buscar o commit do build.
          checkout:
            cloneFlags: --depth=1 --single-branch --no-tags
            fetchFlags: --depth=1 --no-tags
            depth: 1
          podSpecPatch:
            initContainers:
              # Os hooks de plugin rodam no container do comando (node:24.21.0-bookworm),
              # nao em sidecar. Entao `aws` e `jq` precisam chegar no PATH dele.
              # A imagem oficial do AWS CLI ja traz os dois — nada e baixado aqui.
              - name: install-cache-tools
                image: amazon/aws-cli:2.37.6
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    set -eu
                    mkdir -p /workspace/bin /workspace/aws-cli /workspace/lib
                    cp -a /usr/local/aws-cli/v2/current/. /workspace/aws-cli/
                    ln -sf /workspace/aws-cli/bin/aws /workspace/bin/aws
                    cp -a /usr/bin/jq /workspace/lib/jq.bin
                    cp -a /usr/lib64/libjq.so.1* /usr/lib64/libonig.so.5* /workspace/lib/
                    printf '%s\n' '#!/bin/sh' \
                      'exec env LD_LIBRARY_PATH=/workspace/lib /workspace/lib/jq.bin "$$@"' \
                      > /workspace/bin/jq
                    chmod +x /workspace/bin/jq

                    /workspace/bin/aws --version
                    /workspace/bin/jq --version
                volumeMounts:
                  - name: workspace
                    mountPath: /workspace
            containers:
              - name: container-0
                volumeMounts:
                  - name: workspace
                    mountPath: /kbn
                env:
                  - name: PATH
                    value: "/workspace/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
                  # o node:24.21.0-bookworm nao tem `less`; sem isso o aws v2 erra ao paginar
                  - name: AWS_PAGER
                    value: ""
      - gencer/cache#v2.4.15:
          id: node-modules
          backend: s3
          key: "v1-cache-{{ checksum 'pnpm-lock.yaml' }}"
          # Prefixos para hit PARCIAL quando o lockfile muda: o plugin lista os
          # objetos com esse prefixo e baixa o mais recente por LastModified.
          # Sem isso, qualquer alteracao de dependencia da miss total.
          restore-keys:
            - "v1-cache-"
          paths:
            - node_modules
            - .pnpm-store
