steps:
  - label: ":pnpm: install + build"
    agents: {queue: kubernetes}
    image: node:24.21.0-bookworm
    command:
      - cd "/kbn$${BUILDKITE_BUILD_CHECKOUT_PATH#/workspace}"
      - corepack enable
      - corepack prepare pnpm@12.4.2 --activate
      - node scripts/kbn bootstrap --allow-root
      - node scripts/build_kibana_platform_plugins --dist
    env:
      # A infra bloqueia saida para ci-stats e cdn.playwright.dev; nenhum dos
      # dois e necessario para o build.
      CI_STATS_DISABLED: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    plugins:
      - kubernetes:
          checkout:
            # O checkout usa `git clone --reference` contra o mirror do no, entao
            # os objetos vem do disco local. Sem --depth: clone raso nao aproveita
            # os objetos do mirror e voltaria a baixar a arvore inteira do GitHub.
            cloneFlags: -v --single-branch --no-tags
            fetchFlags: -v --no-tags
            gitMirrors:
              path: /buildkite/git-mirrors
              # Mirror no disco do proprio no: persiste entre pods do mesmo no e e
              # recriado do zero quando o no SPOT e substituido.
              volume:
                name: git-mirrors
                hostPath:
                  path: /var/lib/buildkite/git-mirrors
                  type: DirectoryOrCreate
              # O primeiro `git clone --mirror` do Kibana em um no novo leva varios
              # minutos; outros jobs no mesmo no esperam esse lock.
              lockTimeout: 1800
          podSpecPatch:
            nodeSelector:
              node-group: buildkite
            tolerations:
              - key: node-group
                operator: Equal
                value: buildkite
                effect: NoSchedule
            containers:
              - name: container-0
                volumeMounts:
                  - name: workspace
                    mountPath: /kbn
                  - name: git-mirrors
                    mountPath: /buildkite/git-mirrors
