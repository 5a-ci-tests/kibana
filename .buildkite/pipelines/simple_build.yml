steps:
  - label: ":pnpm: install + build"
    agents: {queue: kubernetes}
    image: node:24.21.0-bookworm
    command:
      - cd "/kbn$${BUILDKITE_BUILD_CHECKOUT_PATH#/workspace}"
      - corepack enable
      - corepack prepare pnpm@12.4.2 --activate
      - node scripts/kbn bootstrap --allow-root
      - node scripts/build_kibana_platform_plugins --dist
    env:
      CI_STATS_DISABLED: "true"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    plugins:
      - kubernetes:
          checkout:
            cloneFlags: -v --single-branch --no-tags
            fetchFlags: -v --no-tags
          podSpecPatch:
            containers:
              - name: container-0
                volumeMounts:
                  - name: workspace
                    mountPath: /kbn
      # Sem compressao: o backend `fs` e uma copia local, e gzip/zstd de varios GB
      # custaria mais que o `cp -a`.
      # `node_modules` e `.pnpm-store` (storeDir do pnpm-workspace.yaml) andam juntos:
      # o pnpm valida o node_modules contra o store.
      - cache#v1.11.1:
          backend: fs
          path: node_modules
          manifest: pnpm-lock.yaml
          restore: pipeline
          save:
            - file
            - pipeline
          soft-fail: true
      - cache#v1.11.1:
          backend: fs
          path: .pnpm-store
          manifest: pnpm-lock.yaml
          restore: pipeline
          save:
            - file
            - pipeline
          soft-fail: true
